# STMC, full stack: PostgreSQL + Python AI + NestJS API + React frontend.
#
#   cp .env.example .env     # then fill in the secrets it describes
#   docker compose up -d --build
#
#   the whole system   http://<server>/          (port 80)
#   API docs           http://<server>/api
#
# Everything is reached through the frontend container on port 80, which
# proxies /api to the backend. The backend and the AI are NOT published to
# the network: they talk to each other inside the compose network, so the
# company firewall only has to open one port.
#
# The backend runs its database migrations on start, so a clone deployed
# against an empty database comes up with the full schema and no data.
#
# First start downloads the ~600 MB buffalo_l face model into ./data.
#
# CAMERA NOTE: a container cannot reach a USB webcam on Windows or macOS, so
# /live?source=0 works only when the AI runs on the host. The DVR and RTSP
# cameras this system actually uses work from the container either way.

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Holds both the backend tables and the AI's `facerec` schema.
      POSTGRES_DB: ${DB_NAME:-stmc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published. Uncomment only to inspect the database from outside,
    # and prefer `docker compose exec db psql` instead.
    # ports:
    #   - '5431:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME:-stmc}']
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_NAME: ${DB_NAME:-stmc}
      DB_SCHEMA: facerec
      # How the AI posts sightings back. Without these it falls back to
      # 127.0.0.1 -- itself -- and a built-in development token, and every
      # detection is silently dropped: Alerts and Track & Trace stay empty.
      STMC_BACKEND_URL: http://backend:3000
      STMC_AI_EVENT_TOKEN: ${STMC_AI_EVENT_TOKEN:?set STMC_AI_EVENT_TOKEN in .env}
    volumes:
      # Model pack, embeddings.npy, gallery images, evidence clips, dvr.json.
      # Bind-mounted: biometric data must stay outside the image, and this is
      # the directory to back up.
      - ./data:/app/data
    # Linux only -- Windows and macOS cannot pass a USB camera to a container:
    # devices:
    #   - /dev/video0:/dev/video0
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Turns on the secret-strength checks in validateEnvironment(): the
      # server refuses to start with development secrets.
      NODE_ENV: production
      PORT: '3000'
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_NAME: ${DB_NAME:-stmc}
      # Never in production: the schema comes from migrations, which the
      # entrypoint runs. `true` here lets a code change silently alter or
      # drop a column of live resident data.
      DB_SYNCHRONIZE: 'false'
      AI_BASE_URL: http://ai:8000
      BIOMETRIC_STORAGE_DIR: /app/storage
      # The browser calls /api on the frontend's own origin, so that origin
      # is what CORS must allow. Must list the real address people type.
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?set FRONTEND_ORIGINS in .env}
      JWT_SECRET: ${JWT_SECRET:?}
      STMC_AI_EVENT_TOKEN: ${STMC_AI_EVENT_TOKEN:?}
      BIOMETRIC_ENCRYPTION_KEY: ${BIOMETRIC_ENCRYPTION_KEY:?}
      CAMERA_CREDENTIALS_KEY: ${CAMERA_CREDENTIALS_KEY:?}
      CAMERA_STREAM_SIGNING_KEY: ${CAMERA_STREAM_SIGNING_KEY:?}
      REALTIME_SIGNING_KEY: ${REALTIME_SIGNING_KEY:?}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # The first administrator, created once while the users table is empty.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # Continuous recognition on every enabled camera. Off by default in the
      # code; a deployment that watches the building needs it on, or nothing
      # ever reaches Alerts and Track & Trace.
      CAMERA_MONITORING: ${CAMERA_MONITORING:-true}
    volumes:
      # Encrypted ID cards, lease pages, vehicle licences and face images.
      # Back this up together with ./data and the database.
      - backend_storage:/app/storage
    # Not published: nginx reaches it inside the network.
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin: the browser calls /api and nginx proxies it to the
        # backend. Keeps the system on one port and ready for HTTPS.
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  backend_storage:
