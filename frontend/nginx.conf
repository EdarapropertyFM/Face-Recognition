server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Enrolment uploads: face captures, ID cards, lease pages and vehicle
  # licences all travel as base64 in one JSON body. nginx defaults to 1 MB,
  # which rejects a normal registration.
  client_max_body_size 32m;

  # React Router owns the routes (/enroll, /livewall, ...): any unknown path
  # must return index.html, not a 404, or a page reload breaks.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The API is proxied rather than called directly on port 3000, so the whole
  # system is reachable through this one port. That is what lets the server
  # sit behind HTTPS later without every API call being blocked as mixed
  # content, and means only port 80/443 has to be open.
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Camera MJPEG streams and the realtime event stream never end and must
    # not be buffered: with buffering on, nginx holds the frames and the
    # live wall shows nothing until the connection drops.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    chunked_transfer_encoding on;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
